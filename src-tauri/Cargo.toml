[package]
name = "editor-saucedo"
version = "0.1.0"
description = "Editor de fotos y video para Saucedo Video y Fotografía"
edition = "2021"

[lib]
name = "editor_saucedo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 4
opt-level = 3
strip = true
